name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish and create release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag
        id: package
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version tag (vX.Y.Z[-prerelease]): $RELEASE_TAG" >&2
            exit 1
          fi
          version="$(bun -e "console.log(require('./package.json').version)")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json contains an invalid semantic version: $version" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match package version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate package dry-run
        run: bun run package:dry-run

      - name: Create package tarball
        run: mkdir -p artifacts && bun pm pack --destination ./artifacts --quiet

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish package
        run: npm publish --access public --provenance --tag "${{ steps.package.outputs.npm_tag }}"

      - name: Create GitHub Release
        shell: bash
        run: |
          if [[ "${{ steps.package.outputs.prerelease }}" == "true" ]]; then
            gh release create "$RELEASE_TAG" ./artifacts/*.tgz --verify-tag --generate-notes --prerelease --title "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" ./artifacts/*.tgz --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
